<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>向僵尸开炮</title>
<style>
  /* ============ 设计系统 ============ */
  :root{
    --gold:#ffd54f; --gold-hi:#ffe9a8; --gold-lo:#c98a00;
    --ink:#0a140d; --ink-2:#12220f; --panel:rgba(16,28,18,.82);
    --line:rgba(255,213,79,.28);
    --danger:#ff5b5b; --ok:#5ecf6a;
    --radius:14px;
    --shadow:0 10px 40px rgba(0,0,0,.65);
    --font:"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; overflow:hidden; background:#07130c;
             font-family:var(--font); -webkit-user-select:none; user-select:none; }
  canvas{ display:block; touch-action:none; }

  /* ============ HUD（顶部状态栏） ============ */
  #hud{ position:fixed; top:10px; left:50%; transform:translateX(-50%); z-index:6;
        display:flex; align-items:center; gap:22px; padding:7px 20px;
        background:linear-gradient(180deg,rgba(8,16,10,.9),rgba(10,20,12,.7));
        border:1px solid rgba(255,255,255,.12); border-radius:999px;
        backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
        box-shadow:0 4px 24px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.08);
        color:#fff; font-size:14px; letter-spacing:.5px; }
  #hud .it{ display:flex; align-items:center; gap:7px; }
  #hud .uic{ width:26px; height:26px; background-size:300% 100%; background-repeat:no-repeat;
              filter:drop-shadow(0 2px 3px rgba(0,0,0,.5)); }
  #hud .ic-hp   { background-image:url('assets/ui_s.png'); background-position:50% 0; }
  #hud .ic-wave { background-image:url('assets/ui_s.png'); background-position:100% 0; }
  #hud .ic-score{ background-image:url('assets/ui_s.png'); background-position:0 0; }
  #hud b{ color:var(--gold); font-size:18px; font-weight:800; min-width:16px;
          text-align:center; text-shadow:0 0 10px rgba(255,213,79,.6); }
  #hud .sep{ width:1px; height:20px; background:rgba(255,255,255,.14); }

  /* ============ 商店按钮 ============ */
  #shopBtn{ position:fixed; top:12px; right:14px; z-index:6; padding:9px 18px;
            border:none; border-radius:12px; cursor:pointer; font-family:var(--font);
            font-size:14px; font-weight:800; letter-spacing:1px; color:#3a2600;
            background:linear-gradient(180deg,var(--gold-hi),var(--gold) 45%,var(--gold-lo));
            box-shadow:0 4px 0 #8a6100, 0 8px 20px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.6);
            transition:transform .1s, box-shadow .1s; }
  #shopBtn:active{ transform:translateY(3px); box-shadow:0 1px 0 #8a6100; }
  #shopBtn:disabled{ filter:grayscale(.85); opacity:.55; }

  /* ============ 波次横幅 ============ */
  #banner{ position:fixed; top:24%; left:0; right:0; z-index:7; text-align:center;
           pointer-events:none; opacity:0; transition:opacity .4s ease;
           font-size:42px; font-weight:900; letter-spacing:10px; color:#fff;
           background:linear-gradient(180deg,transparent,rgba(0,0,0,.25),transparent);
           -webkit-text-stroke:1.5px rgba(0,0,0,.5); text-shadow:0 0 24px rgba(255,213,79,.9),
           0 4px 0 #6b3f00, 0 14px 34px rgba(0,0,0,.9); transform:scale(.82); }
  #banner.show{ opacity:1; transform:scale(1);
    transition:opacity .3s, transform .4s cubic-bezier(.18,1.6,.4,1); }
  #banner .sub{ display:block; font-size:15px; font-weight:600; letter-spacing:6px;
                color:var(--gold-hi); margin-top:10px;
                text-shadow:0 2px 8px rgba(0,0,0,.9), 0 0 18px rgba(255,213,79,.5); }

  /* ============ 覆盖层（开始/结束） ============ */
  #overlay{ position:fixed; inset:0; z-index:10; display:flex; align-items:center;
            justify-content:center; text-align:center; flex-direction:column;
            background:radial-gradient(ellipse at 50% 34%, rgba(40,22,8,.88), rgba(5,12,7,.96));
            color:#fff; }
  #overlay h1{ font-size:46px; margin:0 0 12px; font-weight:900; letter-spacing:6px; color:#fff;
               background:linear-gradient(180deg,#fff,var(--gold-hi) 55%,var(--gold));
               -webkit-background-clip:text; -webkit-text-fill-color:transparent;
               filter:drop-shadow(0 4px 0 rgba(107,63,0,.85)) drop-shadow(0 14px 34px rgba(0,0,0,.85)); }
  #overlay .tagline{ font-size:15px; color:#dfe8dc; margin:2px 0; letter-spacing:1px; }
  #overlay .sub{ color:#93a08f; font-size:13px; margin-top:6px; }
  #overlay .statcard{ display:flex; gap:14px; margin-top:18px; }
  #overlay .stat{ background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.12);
                   border-radius:12px; padding:10px 22px; min-width:86px;
                   box-shadow:inset 0 1px 0 rgba(255,255,255,.08); }
  #overlay .stat .v{ font-size:24px; font-weight:900; color:var(--gold);
                      text-shadow:0 0 14px rgba(255,213,79,.5); }
  #overlay .stat .l{ font-size:11px; color:#93a08f; margin-top:2px; letter-spacing:2px; }
  #overlay .dead{ font-size:52px; margin:0 0 6px; filter:drop-shadow(0 6px 20px rgba(255,0,0,.35)); }
  #btn{ margin-top:26px; padding:16px 60px; font-size:19px; font-weight:900; letter-spacing:5px;
        border:none; border-radius:14px; cursor:pointer; font-family:var(--font); color:#3a2600;
        background:linear-gradient(180deg,var(--gold-hi),var(--gold) 50%,var(--gold-lo));
        box-shadow:0 5px 0 #8a6100, 0 14px 30px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.6);
        transition:transform .1s, box-shadow .1s; }
  #btn:active{ transform:translateY(4px); box-shadow:0 1px 0 #8a6100; }

  /* ============ 商店面板 ============ */
  #shop{ position:fixed; inset:0; z-index:12; display:none; align-items:center; justify-content:center;
         background:rgba(3,8,5,.72); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
         animation:fadeIn .2s ease; }
  @keyframes fadeIn{ from{opacity:0} to{opacity:1} }
  #shop .panel{ width:min(580px,94vw); max-height:86vh; overflow-y:auto;
                background:linear-gradient(180deg,#1c2c1c,#122018);
                border:1px solid rgba(255,213,79,.3); border-radius:20px;
                padding:26px 28px; color:#fff; box-shadow:0 30px 80px rgba(0,0,0,.8),
                inset 0 1px 0 rgba(255,255,255,.08); position:relative;
                animation:popIn .3s cubic-bezier(.2,1.5,.4,1); }
  @keyframes popIn{ from{opacity:0; transform:scale(.9) translateY(14px)} to{opacity:1; transform:scale(1) translateY(0)} }
  #shop .panel::before{ content:""; position:absolute; top:0; left:0; right:0; height:3px;
                        background:linear-gradient(90deg,transparent,var(--gold),transparent);
                        border-radius:20px 20px 0 0; }
  #shop h2{ margin:0 0 4px; font-size:24px; font-weight:900; letter-spacing:3px; text-align:center;
            color:var(--gold-hi); text-shadow:0 0 20px rgba(255,213,79,.4); }
  #shop .gold{ text-align:center; font-size:16px; font-weight:800; color:var(--gold);
               margin:8px 0 16px; letter-spacing:1px;
               text-shadow:0 0 12px rgba(255,213,79,.5); }
  #shop .item{ display:flex; align-items:center; justify-content:space-between; gap:14px;
               background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.03));
               border:1px solid rgba(255,255,255,.1); border-radius:14px; padding:14px 18px;
               margin-bottom:10px; transition:border-color .15s, transform .1s; }
  #shop .item:hover{ border-color:rgba(255,213,79,.4); }
  #shop .item .nm{ font-weight:800; font-size:16px; }
  #shop .item .ds{ font-size:12px; color:#93a08f; margin-top:4px; }
  #shop .item .lvl{ font-size:11px; color:var(--gold); background:rgba(255,213,79,.12);
                     padding:1px 8px; border-radius:99px; margin-left:8px; font-weight:700; }
  #shop .item button{ padding:10px 20px; border:none; border-radius:11px; font-size:14px;
                      font-weight:800; cursor:pointer; font-family:var(--font); color:#3a2600;
                      background:linear-gradient(180deg,var(--gold-hi),var(--gold) 50%,var(--gold-lo));
                      box-shadow:0 3px 0 #8a6100, 0 6px 14px rgba(0,0,0,.35); white-space:nowrap;
                      transition:transform .08s; }
  #shop .item button:active{ transform:translateY(2px); }
  #shop .item button:disabled{ background:linear-gradient(180deg,#2c3a2c,#22301f); color:#7c8a78;
                                box-shadow:none; cursor:not-allowed; }
  #shop .close{ display:block; margin:14px auto 0; padding:11px 0; width:100%;
                border:1px solid rgba(255,255,255,.14); border-radius:12px; background:rgba(255,255,255,.07);
                color:#dfe8dc; font-size:15px; font-weight:700; cursor:pointer; font-family:var(--font);
                transition:background .15s; }
  #shop .close:hover{ background:rgba(255,255,255,.14); }

  #tip{ position:fixed; bottom:12px; left:0; right:0; text-align:center; font-size:12px;
        color:rgba(255,255,255,.4); pointer-events:none; z-index:5; letter-spacing:1px; }
  #loading{ position:fixed; inset:0; z-index:20; display:flex; align-items:center; justify-content:center;
            background:#07130c; color:#cfd; font-size:16px; letter-spacing:3px; }
  #loading::after{ content:""; width:8px; animation:dots 1.2s infinite; }
  @keyframes dots{ 0%{content:""} 33%{content:"."} 66%{content:".."} 100%{content:"..."} }
</style>
</head>
<body>
<div id="loading">🎮 正在加载战场</div>
<div id="hud">
  <span class="it"><span class="uic ic-hp"></span><b id="hp">5</b></span>
  <span class="sep"></span>
  <span class="it"><span class="uic ic-wave"></span><b id="lvl">1</b></span>
  <span class="sep"></span>
  <span class="it"><span class="uic ic-score"></span><b id="gold">0</b></span>
</div>
<button id="shopBtn" disabled>⚡ 升级</button>
<div id="banner"></div>
<canvas id="game"></canvas>
<div id="shop">
  <div class="panel">
    <h2>⚔️ 军火商店</h2>
    <div class="gold">💰 <b id="goldAmt">0</b></div>
    <div id="shopItems"></div>
    <button class="close" id="shopClose">继续战斗</button>
  </div>
</div>
<div id="overlay">
  <h1>向僵尸开炮</h1>
  <div class="tagline">僵尸大军压境 · 守住阵地</div>
  <div class="sub">自动开火 · 点击/点按手动瞄准 · ⚡升级按钮强化炮台</div>
  <button id="btn">⚔️ 开始战斗</button>
</div>
<div id="tip">⚡ 右上角「升级」= 商店</div>
<script>
"use strict";
(function () {
  var canvas = document.getElementById("game"), ctx = canvas.getContext("2d");
  var overlay = document.getElementById("overlay"), btn = document.getElementById("btn");
  var shop = document.getElementById("shop"), shopBtn = document.getElementById("shopBtn"), shopClose = document.getElementById("shopClose");
  var elHp = document.getElementById("hp"), elLvl = document.getElementById("lvl"), elGold = document.getElementById("gold");
  var banner = document.getElementById("banner");

  // ===== 素材 =====
  var assets = { bg:null, tower:null, bullet:null, elite:null, z:[] };
  var need = 9, ready = 0;
  function loadImg(arr, name, src){ var img=new Image();
    img.onload=function(){arr[name]=img;done();}; img.onerror=function(){arr[name]=null;done();}; img.src=src; }
  function done(){ ready++; if(ready>=need) start(); }
  loadImg(assets,"bg","assets/bg_s.jpg");
  loadImg(assets,"tower","assets/tower_s.png");
  loadImg(assets,"bullet","assets/bullet_s.png");
  loadImg(assets,"elite","assets/elite_s.png");
  ["z1","z2","z3","z4","zdie"].forEach(function(n,i){ loadImg(assets,"z"+i,"assets/frames/"+n+".png"); });

  var W=0,H=0,DPR=1;
  function resize(){ DPR=window.devicePixelRatio||1;
    W=canvas.width=window.innerWidth*DPR; H=canvas.height=window.innerHeight*DPR;
    canvas.style.width=window.innerWidth+"px"; canvas.style.height=window.innerHeight+"px"; }
  window.addEventListener("resize",resize); resize();

  // ===== 状态 =====
  var state="menu", zombies=[], bullets=[], particles=[], floaters=[], envP=[], coins=[];
  var level=1, hp=5, maxHp=5, gold=0, killed=0, combo=0, killGoal=0, inWave=false;
  var turret={ dmg:1, rate:150, multi:1, pierce:1 };
  var lastShot=0, lastSpawn=0, shake=0, hitStop=0, timeScale=1;
  var targetX=-1, targetY=-1, bannerT=0;

  // ===== 音频 =====
  var ac=null;
  function ensureAudio(){ if(!ac){ try{ac=new (window.AudioContext||window.webkitAudioContext)();}catch(e){} }
    if(ac&&ac.state==="suspended") ac.resume(); }
  function beep(f,d,t,v){ if(!ac)return; try{ var o=ac.createOscillator(),g=ac.createGain();
    o.type=t||"square"; o.frequency.value=f; g.gain.setValueAtTime(v||.1,ac.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d); o.connect(g); g.connect(ac.destination);
    o.start(); o.stop(ac.currentTime+d); }catch(e){} }
  var sfxShoot=function(){ beep(600,.06,"square",.04); beep(340,.09,"square",.035); };
  var sfxHit=function(){ beep(150,.045,"sawtooth",.05); };
  var sfxDie=function(){ beep(340,.16,"sawtooth",.08); setTimeout(function(){beep(190,.22,"sawtooth",.06);},70); };
  var sfxWave=function(){ beep(392,.1,"triangle",.09); setTimeout(function(){beep(523,.12,"triangle",.09);},110); setTimeout(function(){beep(659,.16,"triangle",.09);},230); };
  var sfxLose=function(){ beep(220,.25,"sawtooth",.09); setTimeout(function(){beep(150,.45,"sawtooth",.1);},180); };
  var sfxPulse=function(){ beep(80,.15,"sine",.12); };
  var sfxCoin=function(){ beep(880,.06,"sine",.06); setTimeout(function(){beep(1320,.08,"sine",.05);},60); };
  var sfxBuy=function(){ beep(520,.08,"triangle",.09); setTimeout(function(){beep(780,.1,"triangle",.09);},90); };
  var sfxHitPlayer=function(){ beep(110,.4,"sawtooth",.13); };

  // ===== 关卡 / 生成 =====
  function startLevel(){
    inWave=true; killGoal=6+level*2;
    showBanner("第 "+level+" 关", "消灭 " + killGoal + " 只僵尸");
    sfxWave();
    scheduleZombies();
  }
  function scheduleZombies(){
    var n=3+level;
    for(var i=0;i<n;i++) (function(d){ setTimeout(function(){ if(state==="play"&&inWave) addZombie(false); }, d); })(i*300);
    if(level%4===0){ setTimeout(function(){ if(state==="play"&&inWave) addZombie(true); }, 400); }
    if(level>=5){ setTimeout(function(){ if(state==="play"&&inWave) addZombie(false); }, 1500); }
  }
  function addZombie(isElite){
    var elite=!!isElite;
    var hpZ = elite ? 3+Math.floor(level/2) : 1+Math.floor(level/3);
    var spd = elite ? (14+Math.min(20,level*1.2)+Math.random()*6)*DPR
                    : (22+Math.min(48,level*2.3)+Math.random()*20)*DPR;
    zombies.push({x:W+70*DPR, y:H*(.12+Math.random()*.5), hp:hpZ, maxHp:hpZ, spd:spd,
      t:Math.random()*6, die:false, dieT:0, flash:0, size:elite?(60+Math.random()*12)*DPR:(34+Math.random()*16)*DPR,
      animT:Math.random()*10, elite:elite});
    if(elite) sfxPulse();
  }
  function showBanner(main, sub){
    banner.innerHTML=main+(sub?"<span class='sub'>"+sub+"</span>":"");
    banner.classList.remove("show"); void banner.offsetWidth; banner.classList.add("show"); bannerT=1.6;
  }

  // ===== 射击 =====
  function shoot(angle){
    var px=W/2, py=H-92*DPR, spd=680*DPR;
    var off=(turret.multi-1)/2;
    for(var m=0;m<turret.multi;m++){
      var a=angle+(m-off)*.14;
      bullets.push({x:px,y:py,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd,life:2,trail:[],pierce:turret.pierce});
    }
    sfxShoot();
    for(var i=0;i<4;i++){ var a=angle+(Math.random()-.5)*.5, sp=(120+Math.random()*160)*DPR;
      particles.push({x:px+Math.cos(angle)*50*DPR,y:py+Math.sin(angle)*50*DPR,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,t:0,life:.18,c:"#ffd54f",s:(3+Math.random()*4)*DPR}); }
  }
  function explode(x,y,c,n,sp){ for(var i=0;i<n;i++){ var a=Math.random()*6.28, v=(sp||160)*(.4+Math.random())*DPR;
    particles.push({x:x,y:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-40*DPR,t:0,life:.5+Math.random()*.4,c:c,s:(2+Math.random()*4)*DPR}); } }
  function blood(x,y){ for(var i=0;i<9;i++){ var a=Math.random()*6.28, v=(90+Math.random()*220)*DPR;
    particles.push({x:x,y:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-30*DPR,t:0,life:.55+Math.random()*.45,c:["#8a1f1f","#a52828","#6f1818"][i%3],s:(2+Math.random()*3.5)*DPR}); } }
  function floatText(x,y,txt,big){ floaters.push({x:x,y:y,txt:txt,t:0,life:.85,big:!!big}); }

  function dropCoin(x,y,n){
    for(var i=0;i<n;i++) coins.push({x:x+(Math.random()-.5)*20*DPR,y:y,vx:(Math.random()-.5)*60*DPR,vy:-60*DPR,t:0});
  }
  function damageZombie(z){
    z.hp-=turret.dmg; z.flash=.12; hitStop=40; shake=Math.max(shake,5); sfxHit();
    explode(z.x,z.y-z.size/2,"#ffb84d",4,120); blood(z.x,z.y-z.size/2);
    if(z.hp<=0 && !z.die){
      z.die=true; z.dieT=0; killed++; combo++; timeScale=.45;
      var gain=z.elite?50:10*(combo>=5?2:1);
      gold+=gain; dropCoin(z.x,z.y-z.size/2,z.elite?6:2);
      floatText(z.x,z.y-z.size,(z.elite?"+50":combo>=5?"+"+gain:"+"+gain),true);
      blood(z.x,z.y-z.size/2); blood(z.x+10*DPR,z.y-z.size*.6);
      explode(z.x,z.y-z.size/2,"#7a3",10,180); explode(z.x,z.y-z.size/2,"#a22",6,220);
      sfxDie(); shake=Math.max(shake,7); updateHud();
      setTimeout(function(){ timeScale=1; },220);
      if(killGoal>0 && killed>=killGoal){ levelClear(); }
    }
  }
  function levelClear(){
    if(!inWave) return;
    inWave=false; sfxWave();
    showBanner("✅ 第 "+level+" 关通过", "僵尸变强了");
    level++;
    setTimeout(function(){ if(state==="play") startLevel(); }, 2600);
  }

  // ===== 商店 =====
  var SHOP_ITEMS=[
    {id:"dmg",nm:"强化伤害",ds:"每发子弹伤害 +1",icon:"⚡",base:20,mul:1.6},
    {id:"rate",nm:"强化射速",ds:"射击间隔 -20ms",icon:"🔫",base:20,mul:1.5},
    {id:"multi",nm:"多重射击",ds:"同时发射弹数 +1（最多 4）",icon:"🔱",base:60,mul:2},
    {id:"pierce",nm:"穿透子弹",ds:"子弹可穿透敌人 +1",icon:"🎯",base:50,mul:1.8},
    {id:"heal",nm:"急救包",ds:"恢复全部生命",icon:"❤️",base:15,mul:1.5}
  ];
  var shopOpen=false;
  function renderShop(){
    elGold.textContent=gold;
    var html="";
    SHOP_ITEMS.forEach(function(it){
      var lvl=it.id==="dmg"?turret.dmg:it.id==="rate"?Math.round((150-turret.rate)/20)
        :it.id==="multi"?turret.multi:it.id==="pierce"?turret.pierce:0;
      var maxed=(it.id==="multi"&&turret.multi>=4)||(it.id==="rate"&&turret.rate<=70);
      var price=Math.round(it.base*Math.pow(it.mul,lvl));
      var can=!maxed&&gold>=price;
      html+="<div class='item'><div><div class='nm'>"+it.icon+" "+it.nm+
        (lvl>0?"<span class='lvl'>Lv."+lvl+"</span>":"")+"</div>"+
        "<div class='ds'>"+it.ds+(maxed?"（已满级）":"")+"</div></div>"+
        "<button data-id='"+it.id+"' data-price='"+price+"' "+(can?"":"disabled")+">"+
        (maxed?"MAX":"💰 "+price)+"</button></div>";
    });
    document.getElementById("shopItems").innerHTML=html;
    var btns=document.querySelectorAll("#shopItems button");
    for(var i=0;i<btns.length;i++) (function(b){ b.onclick=function(){ buy(b.dataset.id,+b.dataset.price); }; })(btns[i]);
  }
  function buy(id,price){
    if(gold<price) return;
    gold-=price; sfxBuy();
    if(id==="dmg") turret.dmg++;
    else if(id==="rate") turret.rate=Math.max(70,turret.rate-20);
    else if(id==="multi") turret.multi=Math.min(4,turret.multi+1);
    else if(id==="pierce") turret.pierce++;
    else if(id==="heal"){ hp=maxHp; }
    updateHud(); renderShop();
    floatText(W/2,H*.4,"已强化！",true);
  }
  function openShop(){ if(state!=="play"||shopOpen) return; shopOpen=true; shop.style.display="flex"; renderShop(); }
  function closeShop(){ shopOpen=false; shop.style.display="none"; }

  // ===== 流程 =====
  function gameOver(){
    state="over"; sfxLose(); shake=14; sfxPulse();
    overlay.innerHTML="<div class='dead'>💀</div>"+
      "<h1>阵地失守</h1>"+
      "<div class='statcard'>"+
      "<div class='stat'><div class='v'>"+gold+"</div><div class='l'>金币</div></div>"+
      "<div class='stat'><div class='v'>"+level+"</div><div class='l'>到达关卡</div></div>"+
      "<div class='stat'><div class='v'>"+killed+"</div><div class='l'>击杀</div></div>"+
      "</div>"+
      "<p class='sub'>伤害 Lv."+turret.dmg+" · 多重 "+turret.multi+" · 穿透 "+turret.pierce+"</p>"+
      "<button id='btn'>🔄 再战一场</button>";
    document.getElementById("btn").onclick=startGame;
  }
  function startGame(){
    ensureAudio();
    zombies=[];bullets=[];particles=[];floaters=[];coins=[];
    level=1;hp=5;maxHp=5;gold=0;killed=0;combo=0;killGoal=0;inWave=false;
    turret={dmg:1,rate:150,multi:1,pierce:1};
    lastShot=0;timeScale=1;shopOpen=false;shop.style.display="none";
    updateHud(); overlay.style.display="none"; state="play"; shopBtn.disabled=false;
    startLevel();
  }
  function start(){ document.getElementById("loading").style.display="none"; resize(); requestAnimationFrame(loop); }
  function updateHud(){ elHp.textContent=hp; elLvl.textContent=level; elGold.textContent=gold; }

  // ===== 主循环 =====
  var last=0;
  function loop(now){
    if(!last) last=now;
    var rawDt=Math.min((now-last)/1000,.05); last=now;
    if(hitStop>0){ hitStop-=rawDt*1000; } else { update(rawDt*timeScale,now); }
    render(now);
    requestAnimationFrame(loop);
  }
  function update(dt,now){
    updateEnv(dt);
    if(state!=="play") return;
    if(bannerT>0){ bannerT-=dt; if(bannerT<=0) banner.classList.remove("show"); }
    if(inWave&&now-lastSpawn>2000&&zombies.length<2+level&&killed<killGoal){ addZombie(false); lastSpawn=now; }

    var nearest=null,best=1e18;
    for(var i=0;i<zombies.length;i++){ var z=zombies[i]; if(z.die)continue;
      var dx=z.x-W/2,dy=z.y-H*.78,d=dx*dx+dy*dy; if(d<best){best=d;nearest=z;} }
    var px=W/2,py=H-92*DPR,angle;
    if(targetX>=0){ angle=Math.atan2(targetY-py,targetX-px); targetX=-1; }
    else if(nearest){
      var dist=Math.sqrt((nearest.x-px)*(nearest.x-px)+(nearest.y-py)*(nearest.y-py));
      var tFlight=dist/680/DPR;
      angle=Math.atan2((nearest.y+nearest.spd*tFlight*.08)-py, (nearest.x-nearest.spd*tFlight)-px);
    }
    else angle=Math.atan2(-1,0);
    if(now-lastShot>turret.rate){ shoot(angle); lastShot=now; }

    for(var i=bullets.length-1;i>=0;i--){ var b=bullets[i];
      b.trail.push({x:b.x,y:b.y}); if(b.trail.length>7) b.trail.shift();
      b.x+=b.vx*dt; b.y+=b.vy*dt; b.life-=dt;
      var hit=false;
      for(var j=0;j<zombies.length;j++){ var z2=zombies[j]; if(z2.die)continue;
        var cx=z2.x,cy=z2.y-z2.size/2;
        if((b.x-cx)*(b.x-cx)+(b.y-cy)*(b.y-cy)<z2.size*z2.size*.55){ damageZombie(z2); hit=true;
          if(b.pierce>1){ b.pierce--; } else break; } }
      if(hit||b.life<=0||b.x>W+30||b.x<-30) bullets.splice(i,1);
    }

    for(var i=zombies.length-1;i>=0;i--){ var z3=zombies[i]; z3.t+=dt; z3.animT+=dt;
      if(!z3.die){
        z3.x-=z3.spd*dt;
        if(z3.flash>0) z3.flash-=dt;
        if(z3.x<42*DPR){ zombies.splice(i,1); hp--; updateHud(); sfxHitPlayer(); shake=12; hitStop=90;
          explode(px,py,"#f55",14,200); floatText(px,py-46*DPR,"-1");
          if(hp<=0){ gameOver(); return; } continue; }
      } else { z3.dieT+=dt; if(z3.dieT>.6){ zombies.splice(i,1); continue; } }
    }
    updateHud();

    var gx=W/2,gy=H-92*DPR;
    for(var i=coins.length-1;i>=0;i--){ var c=coins[i]; c.t+=dt;
      var dxc=gx-c.x,dyc=gy-c.y,dist=Math.sqrt(dxc*dxc+dyc*dyc);
      if(dist<90*DPR){ c.x+=dxc/dist*420*DPR*dt; c.y+=dyc/dist*420*DPR*dt;
        if(dist<18*DPR){ coins.splice(i,1); sfxCoin(); continue; } }
      else { c.x+=c.vx*dt; c.y+=c.vy*dt; c.vy+=140*DPR*dt; } }
  }
  function updateEnv(dt){
    if(envP.length<22&&Math.random()<.3){ envP.push({x:W+10,y:H*(.1+Math.random()*.7),vx:-(20+Math.random()*30)*DPR,vy:(Math.random()-.5)*10*DPR,t:0,life:8+Math.random()*6,r:(1+Math.random()*2.5)*DPR,f:Math.random()*6.28,c:Math.random()<.3?"#ffe9a8":"#bfe8d2",a:.3+Math.random()*.4}); }
    for(var i=envP.length-1;i>=0;i--){ var p=envP[i]; p.t+=dt; p.x+=p.vx*dt; p.y+=p.vy*dt+p.f*.3;
      if(p.t>p.life||p.x<-20){ envP.splice(i,1); } }
    for(var i=particles.length-1;i>=0;i--){ var p=particles[i]; p.t+=dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=300*DPR*dt;
      if(p.t>p.life){ particles.splice(i,1); continue; } }
    for(var i=floaters.length-1;i>=0;i--){ var f=floaters[i]; f.t+=dt; f.y-=46*DPR*dt;
      if(f.t>f.life){ floaters.splice(i,1); } }
  }

  // ===== 渲染 =====
  function render(now){
    ctx.clearRect(0,0,W,H);
    if(assets.bg){ var bgr=Math.max(W/assets.bg.width,H/assets.bg.height);
      ctx.drawImage(assets.bg,(W-assets.bg.width*bgr)/2,0,assets.bg.width*bgr,assets.bg.height*bgr); }
    else { ctx.fillStyle="#12293c"; ctx.fillRect(0,0,W,H); }
    ctx.save();
    if(shake>0){ ctx.translate((Math.random()-.5)*shake*2,(Math.random()-.5)*shake*2); shake*=.84; }

    for(var i=0;i<envP.length;i++){ var p=envP[i];
      ctx.globalAlpha=p.a*(1-p.t/p.life); ctx.fillStyle=p.c;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,7); ctx.fill(); }
    ctx.globalAlpha=1;

    if(state==="play"){
      var px=W/2,py=H-92*DPR,tSize=Math.min(W*.17,140*DPR);
      if(assets.tower){ var recoil=now-lastShot<70?tSize*.13:0;
        var nearest=null,best=1e18;
        for(var i=0;i<zombies.length;i++){ var z=zombies[i]; if(z.die)continue;
          var dx=z.x-W/2,dy=z.y-H*.78,d=dx*dx+dy*dy; if(d<best){best=d;nearest=z;} }
        var angle=nearest?Math.atan2(nearest.y-py,nearest.x-px):Math.atan2(-1,0);
        ctx.save(); ctx.translate(px,py-tSize*.28); ctx.rotate(angle);
        ctx.drawImage(assets.tower,-tSize/2-recoil,-tSize/2,tSize,tSize); ctx.restore();
        ctx.fillStyle="rgba(0,0,0,.4)"; ctx.beginPath(); ctx.ellipse(px,py+16*DPR,tSize*.44,tSize*.12,0,0,7); ctx.fill(); }
    }

    for(var i=0;i<zombies.length;i++){ drawZombie(zombies[i]); }
    for(var i=0;i<bullets.length;i++){ var b=bullets[i];
      for(var k=0;k<b.trail.length;k++){ ctx.globalAlpha=k/b.trail.length*.5; ctx.fillStyle="#ffd54f";
        ctx.beginPath(); ctx.arc(b.trail[k].x,b.trail[k].y,(2.5+k)*DPR,0,7); ctx.fill(); }
      ctx.globalAlpha=1; var bs=18*DPR;
      if(assets.bullet){ ctx.drawImage(assets.bullet,b.x-bs/2,b.y-bs/2,bs,bs); }
      else { ctx.fillStyle="#fff3b0"; ctx.beginPath(); ctx.arc(b.x,b.y,5*DPR,0,7); ctx.fill(); } }
    for(var i=0;i<coins.length;i++){ var c=coins[i];
      var cs=(16+Math.sin(c.t*8)*3)*DPR;
      ctx.fillStyle="#ffd54f"; ctx.shadowColor="#ffb300"; ctx.shadowBlur=10*DPR;
      ctx.beginPath(); ctx.arc(c.x,c.y,cs/2,0,7); ctx.fill(); ctx.shadowBlur=0;
      ctx.fillStyle="#b8860b"; ctx.font="bold "+(11*DPR)+"px sans-serif"; ctx.textAlign="center";
      ctx.fillText("¥",c.x,c.y+4*DPR); }
    for(var i=0;i<particles.length;i++){ var p=particles[i];
      ctx.globalAlpha=1-p.t/p.life; ctx.fillStyle=p.c;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.s*(1-p.t/p.life*.5),0,7); ctx.fill(); }
    ctx.globalAlpha=1;
    // 飘字（描边+渐变质感）
    for(var i=0;i<floaters.length;i++){ var f=floaters[i];
      var a=1-f.t/f.life, fs=f.big?22*DPR:17*DPR;
      ctx.globalAlpha=a;
      ctx.font="900 "+fs+"px sans-serif"; ctx.textAlign="center";
      ctx.lineWidth=4*DPR; ctx.strokeStyle="rgba(0,0,0,.75)"; ctx.lineJoin="round";
      ctx.strokeText(f.txt,f.x,f.y);
      var gr=ctx.createLinearGradient(0,f.y-fs,0,f.y);
      gr.addColorStop(0,"#fff"); gr.addColorStop(1,"#ffd54f");
      ctx.fillStyle=gr; ctx.fillText(f.txt,f.x,f.y);
      ctx.globalAlpha=1; }
    ctx.restore();
    var vg=ctx.createLinearGradient(0,0,0,H*.25); vg.addColorStop(0,"rgba(0,0,0,.35)"); vg.addColorStop(1,"rgba(0,0,0,0)");
    ctx.fillStyle=vg; ctx.fillRect(0,0,W,H*.25);
  }

  function drawZombie(z){
    if(z.die){
      var img=z.elite?(assets.elite||assets.z[4]):assets.z[4]; if(!img) return;
      ctx.save(); ctx.translate(z.x,z.y-z.size/2); ctx.rotate(Math.min(1,z.dieT*2.2));
      ctx.globalAlpha=Math.max(0,1-z.dieT/.6);
      ctx.drawImage(img,-z.size/2,-z.size/2,z.size,z.size); ctx.restore(); return;
    }
    if(z.elite&&assets.elite){
      ctx.save(); var pulse=1+Math.sin(z.t*5)*.04;
      ctx.translate(z.x,z.y-z.size*.8);
      if(z.flash>0) ctx.filter="brightness(2)";
      ctx.drawImage(assets.elite,-z.size/2*pulse,-z.size*.6*pulse,z.size*pulse,z.size*pulse);
      ctx.restore();
    } else {
      var fIdx=Math.floor(z.animT*7)%4; var img=assets.z[fIdx]||assets.z[0];
      ctx.save(); ctx.translate(z.x,z.y-z.size);
      if(z.flash>0) ctx.filter="brightness(1.9) saturate(.3)";
      ctx.drawImage(img,-z.size/2,-z.size*.75,z.size,z.size); ctx.restore();
    }
    if(z.maxHp>1){ var bw=z.size,ratio=Math.max(0,z.hp/z.maxHp);
      ctx.fillStyle="rgba(0,0,0,.55)"; ctx.fillRect(z.x-bw/2,z.y-z.size-12*DPR,bw,5*DPR);
      ctx.fillStyle=z.elite?"#c33":"#5c5"; ctx.fillRect(z.x-bw/2,z.y-z.size-12*DPR,bw*ratio,5*DPR);
      ctx.fillStyle=z.elite?"#700":"#3a3"; ctx.fillRect(z.x-bw/2+bw*ratio,z.y-z.size-12*DPR,bw*(1-ratio),5*DPR); }
  }

  // ===== 交互 =====
  function pointer(e){ ensureAudio(); if(state!=="play") return;
    var r=canvas.getBoundingClientRect();
    targetX=(e.clientX-r.left)*DPR; targetY=(e.clientY-r.top)*DPR; }
  canvas.addEventListener("mousedown",pointer);
  canvas.addEventListener("touchstart",function(e){ e.preventDefault(); pointer(e.touches[0]); },{passive:false});
  btn.onclick=startGame;
  shopBtn.onclick=openShop;
  shopClose.onclick=closeShop;
})();
</script>
</body>
