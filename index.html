<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="refresh" content="30">
<title>状态看板</title>
<style>
  body { max-width: 720px; margin: 0 auto; padding: 24px 16px 64px;
         font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
         color: #1f2329; line-height: 1.7; background: #f7f8fa; }
  .card { background: #fff; border-radius: 12px; padding: 24px;
          box-shadow: 0 1px 4px rgba(0,0,0,.08); }
  h1 { font-size: 22px; margin: 0 0 8px; }
  .status { display: inline-block; padding: 4px 14px; border-radius: 999px;
            font-size: 14px; background: #e1f5ee; color: #0f6e56; }
  .meta { color: #8f959e; font-size: 13px; margin-top: 16px; }
  .content { margin-top: 16px; white-space: pre-wrap; }
</style>
</head>
<body>
<div class="card">
  <h1>状态看板</h1>
  <span class="status">● 系统就绪</span>
  <div class="content">等待接入"截屏识别"模块。</div>
  <div class="meta">页面每 30 秒自动刷新 · EdgeOne Pages 托管</div>
</div>
</body>
</html>
